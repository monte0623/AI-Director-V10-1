<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#111827">

    <title>
        AI Director V10.1
    </title>

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="stylesheet"
        href="css/main.css">

    <link
        rel="stylesheet"
        href="css/layout.css">

    <link
        rel="stylesheet"
        href="css/dashboard.css">

</head>

<body>

<div class="app">

    <!-- ========================================= -->
    <!-- Header                                    -->
    <!-- ========================================= -->

    <header class="app-header">

        <div class="app-title">

            AI Director V10.1

        </div>

        <div class="app-actions">

            <button
                id="newProjectButton"
                class="primary-button">

                建立製作案

            </button>

        </div>

    </header>

    <!-- ========================================= -->
    <!-- Main                                      -->
    <!-- ========================================= -->

    <main class="app-main">

        <!-- ================= Dashboard ================= -->

        <section
            id="dashboardPage"
            class="page dashboard">

            <section class="dashboard-hero">

                <h1>

                    AI Director

                </h1>

                <p>

                    Film Production Assistant

                </p>

            </section>

            <section class="dashboard-toolbar">

                <h2>

                    製作案

                </h2>

                <button
                    class="primary-button"
                    id="toolbarCreateProjectButton">

                    ＋ 建立製作案

                </button>

            </section>

            <section
                id="projectGrid"
                class="project-grid">

            </section>

        </section>


        <!-- ================= Project ================= -->

        <section id="projectPage" class="page hidden">
            <div class="card">
<h2 id="projectTitle">Project Hub</h2>
<p><strong>Project Overview</strong></p>
<table style="width:100%;margin-bottom:16px">
<tr><td>Project</td><td id="projectNameValue">Current Project</td></tr>
<tr><td>Status</td><td>Active</td></tr>
<tr><td>Planning</td><td>0%</td></tr>
<tr><td>Assets</td><td>0%</td></tr>
<tr><td>Workspace</td><td>Ready</td></tr>
</table>
<div class="project-hub-grid">
<button id="openPlanningButton" class="primary-button">Planning</button>
<button id="openAssetsButton" class="primary-button">Production Assets</button>
<button id="openWorkspaceButton" class="primary-button">Workspace</button>
</div>
<hr>
<h3>Quick Actions</h3>
<div class="project-hub-grid">
<button class="primary-button" id="quickScript">Script</button>
<button class="primary-button" id="quickFigure">Figure</button>
<button class="primary-button" id="quickLocation">Location</button>
</div>
<button id="backProjectDashboardButton" class="primary-button">返回 Dashboard</button>
</div>
        </section>

        <!-- ================= Workspace ================= -->

        <section
            id="workspacePage"
            class="page hidden">

            <div class="card">

                <h2>

                    Workspace

                </h2>

                <p>

                    Build001-A Foundation

                </p>

                <p>

                    Build002 開始加入 Script、Scene、Shot。

                </p>

                <button
                    id="backDashboardButton"
                    class="primary-button">

                    返回 Dashboard

                </button>

            </div>

        </section>

    </main>

</div>

<script type="module" src="js/app.js"></script>


<div id="build-version" style="position:fixed;left:12px;bottom:12px;background:#111;color:#fff;padding:8px 12px;border-radius:8px;font:12px monospace;z-index:9999;opacity:.9">
AI Director V10.1<br>
Build001-M2<br>
2026-07-31
</div>

</body>

</html>
